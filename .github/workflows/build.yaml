name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - android
      publish:
        description: "Publish release?"
        type: boolean
        default: false
        required: true
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main"]

env:
  APP_NAME: "Moosync"

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='{"include": []}'

          LINUX_X64='{
            "name": "Linux x64",
            "os": "ubuntu-22.04",
            "target": "//package/linux:linux_release",
            "artifact_path_base": "bazel-bin/package/linux",
            "artifact_patterns": "Moosync-*-*.x86_64.rpm\nMoosync-*-*.amd64.deb\nMoosync-*-*.x86_64.AppImage"
          }'

          LINUX_ARM='{
            "name": "Linux ARM64",
            "os": "ubuntu-22.04-arm",
            "target": "//package/linux:linux_release",
            "artifact_path_base": "bazel-bin/package/linux",
            "artifact_patterns": "Moosync-*-*.aarch64.rpm\nMoosync-*-*.arm64.deb\nMoosync-*-*.aarch64.AppImage"
          }'

          MAC_X64='{
            "name": "macOS x64",
            "os": "macos-15-intel",
            "target": "//package/apple:apple_release",
            "artifact_path_base": "bazel-bin/package/apple",
            "artifact_patterns": "Moosync-*-*.darwin-x64.zip"
          }'

          MAC_ARM='{
            "name": "macOS ARM64",
            "os": "macos-latest",
            "target": "//package/apple:apple_release",
            "artifact_path_base": "bazel-bin/package/apple",
            "artifact_patterns": "Moosync-*-*.darwin-arm64.zip"
          }'

          WIN_X64='{
            "name": "Windows x64",
            "os": "ubuntu-22.04",
            "target": "//package/windows:windows_release",
            "extra_flags": "--platforms=//:windows_x86_64_gnu",
            "artifact_path_base": "bazel-bin/package/windows",
            "artifact_patterns": "Moosync-*-*.x86_64-setup.exe\nMoosync-*-*.x86_64.exe"
          }'

          ANDROID_ARM64='{
            "name": "Android ARM64",
            "os": "ubuntu-22.04",
            "target": "//android:moosync_apk",
            "extra_flags": "--config=android_arm64",
            "artifact_path_base": "bazel-bin/android",
            "artifact_patterns": "moosync_apk.apk",
            "rename_to": "Moosync-android-arm64.apk"
          }'

          ANDROID_X64='{
            "name": "Android x86_64",
            "os": "ubuntu-22.04",
            "target": "//android:moosync_apk",
            "extra_flags": "--config=android_x86_64",
            "artifact_path_base": "bazel-bin/android",
            "artifact_patterns": "moosync_apk.apk",
            "rename_to": "Moosync-android-x86_64.apk"
          }'

          INPUT="${{ inputs.platform || 'all' }}"

          if [[ "$INPUT" == "all" || "$INPUT" == "linux" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$LINUX_X64, $LINUX_ARM]")
          fi

          if [[ "$INPUT" == "all" || "$INPUT" == "macos" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$MAC_X64, $MAC_ARM]")
          fi

          if [[ "$INPUT" == "all" || "$INPUT" == "windows" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$WIN_X64]")
          fi

          if [[ "$INPUT" == "all" || "$INPUT" == "android" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$ANDROID_ARM64, $ANDROID_X64]")
          fi

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-and-test:
    needs: configure
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - name: Free Disk Space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Install Common Linux Dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            nasm yasm autoconf automake libtool pkg-config make build-essential clang
            libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev
            nsis
          version: 1.0

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install nasm

      - name: Setup Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache NDK (Android)
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.13599879
          key: ndk-${{ runner.os }}-29.0.13599879

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719 # v16

      - name: Install NDK (Android)
        run: yes | sdkmanager "ndk;29.0.13599879"

      - uses: bazel-contrib/setup-bazel@0.16.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Bazel Build Package
        run: bazel build ${{ matrix.target }} ${{ matrix.extra_flags }} -c opt
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13599879

      - name: Prepare Artifacts for Upload
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.rename_to }}" ]; then
            cp -L ${{ matrix.artifact_path_base }}/${{ matrix.artifact_patterns }} dist/${{ matrix.rename_to }}
          else
            echo "${{ matrix.artifact_patterns }}" | while read -r pattern; do
              if [[ -z "$pattern" ]]; then continue; fi
              cp -L ${{ matrix.artifact_path_base }}/$pattern dist/
            done
          fi
          ls -R dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moosync-package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name:
          Prepare Release Assets
          # Construct latest-android.json for Android releases
        id: prepare-release
        run: |
          mkdir -p release-assets
          find ./artifacts -type f -exec cp {} ./release-assets/ \;
          ls -R release-assets/

          if ls release-assets/*-android-*.apk 1>/dev/null 2>&1; then
            echo "Generating latest-android.json..."
            VERSION=$(grep -o 'VERSION = "[^"]*"' version.bzl | cut -d'"' -f2)
            NOTES="See the assets to download this version and install."
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")

            PLATFORMS_JSON="{"
            SEP=""

            for apk in release-assets/*-android-*.apk; do
              filename=$(basename "$apk")
              target=$(echo "$filename" | sed -E 's/^.*-android-([a-z0-9_]+)\.apk$/\1/')
              if [ "$target" = "arm64" ]; then
                platform_key="android-aarch64"
              elif [ "$target" = "x86_64" ]; then
                platform_key="android-x86_64"
              else
                platform_key="$target"
              fi

              signature=$(sha256sum "$apk" | awk '{print $1}')
              url="https://github.com/Moosync/Moosync/releases/download/Moosync-v${VERSION}/${filename}"
              PLATFORMS_JSON="${PLATFORMS_JSON}${SEP}\"${platform_key}\": {\"signature\": \"${signature}\", \"url\": \"${url}\"}"
              SEP=","
            done

            PLATFORMS_JSON="${PLATFORMS_JSON}}"

            cat > release-assets/latest-android.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${PUB_DATE}",
            "platforms": ${PLATFORMS_JSON}
          }
          EOF
            echo "latest-android.json generated:"
            cat release-assets/latest-android.json
          fi

          VERSION=$(grep -o 'VERSION = "[^"]*"' version.bzl | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Moosync v${{ steps.prepare-release.outputs.version }}
          tag_name: Moosync-v${{ steps.prepare-release.outputs.version }}
          body: "See the assets to download this version and install."
          draft: true
          prerelease: true
          files: |
            release-assets/*
