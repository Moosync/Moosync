name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
  pull_request:
    branches: ["main"]

env:
  APP_NAME: "Moosync"

permissions:
  actions: write
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='{"include": []}'
                  
          LINUX_X64='{
            "name": "Linux x64",
            "os": "ubuntu-22.04",
            "target": "//package/linux:linux_release",
            "artifact_path_base": "bazel-bin/package/linux",
            "artifact_patterns": "Moosync-*-*.x86_64.rpm\nMoosync-*-*.amd64.deb\nMoosync-*-*.x86_64.AppImage"
          }'

          LINUX_ARM='{
            "name": "Linux ARM64",
            "os": "ubuntu-22.04-arm",
            "target": "//package/linux:linux_release",
            "artifact_path_base": "bazel-bin/package/linux",
            "artifact_patterns": "Moosync-*-*.aarch64.rpm\nMoosync-*-*.arm64.deb\nMoosync-*-*.aarch64.AppImage"
          }'

          MAC_X64='{
            "name": "macOS x64",
            "os": "macos-15-intel",
            "target": "//package/apple:apple_release",
            "artifact_path_base": "bazel-bin/package/apple",
            "artifact_patterns": "Moosync-*-*.darwin-x64.zip"
          }'

          MAC_ARM='{
            "name": "macOS ARM64",
            "os": "macos-latest",
            "target": "//package/apple:apple_release",
            "artifact_path_base": "bazel-bin/package/apple",
            "artifact_patterns": "Moosync-*-*.darwin-arm64.zip"
          }'

          WIN_X64='{
            "name": "Windows x64",
            "os": "windows-latest",
            "target": "//package/windows:windows_release",
            "artifact_path_base": "bazel-bin/package/windows",
            "artifact_patterns": "Moosync-*-*.x86_64-setup.exe\nMoosync-*-*.x86_64.exe"
          }'

          INPUT="${{ inputs.platform || 'all' }}"

          if [[ "$INPUT" == "all" || "$INPUT" == "linux" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$LINUX_X64, $LINUX_ARM]")
          fi

          if [[ "$INPUT" == "all" || "$INPUT" == "macos" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$MAC_X64, $MAC_ARM]")
          fi

          if [[ "$INPUT" == "all" || "$INPUT" == "windows" ]]; then
             MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ".include += [$WIN_X64]")
          fi

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-and-test:
    needs: configure
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - name: Enable Git Long Paths (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true 
          git config --global core.symlinks true

      - name: Free Disk Space (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # Keep Android SDK for cross-compiling
          dotnet: true
          haskell: true
          large-packages: false # Slow, skip it - dotnet/haskell save ~7GB
          docker-images: false # Slow
          swap-storage: true

      - name: Set up swap space
        if: matrix.os == 'ubuntu-22.04'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v4

      - uses: MulverineX/setup-bazel@replace-cache-after-change
        with:
          bazelisk-cache: false
          disk-cache: true
          # Disable disk cache re-upload for Linux x64 (Android build causes non-deterministic outputs)
          disk-cache-reupload: ${{ matrix.os != 'ubuntu-22.04' }}
          repository-cache: true

      - name: Install Common linux Dependencies
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: |
          sudo apt install libwebkit2gtk-4.1-dev gir1.2-javascriptcoregtk-4.1
          libgtk-3-dev libunwind-dev librsvg2-dev patchelf 
          alsa-tools libasound2-dev libudev-dev 
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev 
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad 
          gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools 
          gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl 
          gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio libappindicator3-dev 
          nasm yasm autoconf automake libtool pkg-config make build-essential binutils lld clang libenchant-2-2

      - name: Install ARM-Only linux Dependencies
        if: matrix.os == 'ubuntu-22.04-arm'
        run: |
          sudo apt install curl file xdg-utils libfuse2 libayatana-appindicator3-dev

      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          update: true
          msystem: MSYS
          install: >-
            curl git patch diffutils zip unzip pkgconf
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-nsis

      - name: Add MSYS2 to PATH
        shell: powershell
        if: runner.os == 'Windows'
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}"

          # Add MinGW64 bin (This is where makensis lives)
          echo "$root\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Add MSYS generic bin (This is where bash/sh live)
          echo "$root\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: runner.os == 'Windows'
        with:
          target: wasm32-unknown-unknown
          cache: false

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Windows'
        with:
          tool: wasm-bindgen-cli

      - name: Bazel Build Package
        run: bazel build ${{ matrix.target }} -c opt --action_env=PATH
        env:
          MSYS2_PATH: ${{ runner.os == 'Windows' && steps.msys2.outputs.msys2-location || '' }}
          # Unset Android env vars on ARM since it doesn't have the SDK
          ANDROID_HOME: ${{ matrix.os == 'ubuntu-22.04-arm' && '' || null }}
          ANDROID_NDK_HOME: ${{ matrix.os == 'ubuntu-22.04-arm' && '' || null }}

      - name: Prepare Artifacts for Upload
        shell: bash
        run: |
          mkdir -p dist
          echo "${{ matrix.artifact_patterns }}" | while read -r pattern; do
            if [[ -z "$pattern" ]]; then continue; fi
            cp -L ${{ matrix.artifact_path_base }}/$pattern dist/
          done
          ls -R dist/

      # Linux: Upload each format separately
      - name: Upload RPM
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: moosync-${{ matrix.name }}-rpm
          path: dist/*.rpm
          if-no-files-found: warn

      - name: Upload DEB
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: moosync-${{ matrix.name }}-deb
          path: dist/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: moosync-${{ matrix.name }}-appimage
          path: dist/*.AppImage
          if-no-files-found: warn

      # Non-Linux: Upload all as single artifact
      - name: Upload Desktop Artifact
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        uses: actions/upload-artifact@v4
        with:
          name: moosync-package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

      - name: Setup Java (Android)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Android APKs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd tauri/gen/android
          ./gradlew assembleArm64Debug assembleX86_64Debug \
            -PtargetList=aarch64,x86_64 \
            -PabiList=arm64-v8a,x86_64 \
            -ParchList=arm64,x86_64 \
            --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Android arm64 APK
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: moosync-android-arm64
          path: tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error

      - name: Upload Android x86_64 APK
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: moosync-android-x86_64
          path: tauri/gen/android/app/build/outputs/apk/x86_64/debug/*.apk
          if-no-files-found: error

      - name: Build macOS x64 (Cross-compile from Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: bazel build //package/apple:apple_release --config=darwin_cross -c opt

      - name: Upload macOS x64 Cross-compiled Package
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: moosync-macos-x64-cross
          path: bazel-bin/package/apple/Moosync-*-*.darwin-x64.zip
          if-no-files-found: error
