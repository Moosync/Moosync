[package]
name = "moosync-deps"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "core/types/src/lib.rs"

# This manifest exists solely for Bazel crate_universe dependency resolution.
# Do not build this crate directly with Cargo.

[dependencies]
async-trait = "0.1.89"
bitcode = "0.6.7"
blake3 = { version = "1.8.2", default-features = false }
chacha20poly1305 = "0.10.1"
criterion = "0.5.1"
crossbeam-channel = "0.5.15"
dunce = "1.0.5"
env_logger = "0.11.8"
extism = "1.12.0"
extism-convert = "1.12.0"
fast_image_resize = "5.3.0"
fs_extra = "1.3.0"
futures = { version = "0.3.31", default-features = false, features = ["executor"] }
futures-util = { version = "0.3.31", default-features = false }
glob = "0.3.3"
hex = "0.4.3"
i-slint-backend-testing = "=1.17.1"
image = "0.25.8"
interprocess = { version = "2.2.3", features = ["tokio"] }
is_wine = "0.1.2"
jni = { version = "0.21", default-features = false, features = ["invocation"] }
json_dotpath = "1.1.0"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
lazy_static = "1.5.0"
libpulse-binding = "2.30.1"
libsqlite3-sys = { version = "0.35.0", features = ["bundled"] }
lofty = { version = "0.22.4", default-features = false }
lru = "0.18.0"
mockall = "0.13.1"
notify = "8.2.0"
num_cpus = "1.17.0"
openssl-sys = "0.9.111"
platform-dirs = "0.3.0"
proc-macro2 = "1.0.92"
prost = "0.14"
prost-types = { version = "0.14", default-features = false }
protobuf = { version = "3.7.2", default-features = false, features = ["bytes"] }
protoc-gen-prost = "0.3.1"
quote = "1.0.38"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
rand = "0.8.5"
regex = "1.12.2"
reqwest = { version = "0.12.26", features = ["json", "stream"] }
rfd = { version = "0.17.2", features = ["xdg-portal"] }
rusqlite = { version = "0.37.0", features = ["trace"] }
rust-crypto = "0.2.36"
rusty_ffmpeg = { version = "0.16.7+ffmpeg.8", default-features = false, features = ["ffmpeg8"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.145", default-features = false }
slint = { version = "1.17.1", features = ["backend-android-activity-06", "mcp"] }
slint-build = "1.17.1"
slint-lsp = { version = "1.17.1", default-features = false }
souvlaki = "0.7.3"
substring = "1.4.5"
syn = { version = "2.0.96", features = ["full"] }
tempdir = "0.3.7"
thiserror = "2.0.17"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "rt", "macros", "sync"] }
tracing = { version = "0.1.41", default-features = false }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "js"] }
vergen = "=9.0.6"
whoami = { version = "1.6.1", default-features = false }
windows = { version = "0.44", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
wiremock = "0.6.5"
zip-extensions = "0.8"

# Git dependencies
librespot = { git = "https://github.com/librespot-org/librespot", rev = "33bf3a77ed4b549df67e8347d7d6e55b007b3ec2", default-features = false, features = ["rodio-backend", "native-tls"] }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "ffa1d8a2e5fc3efdec2c675eecca8f1f4be4e0f2", default-features = false, features = ["playback"] }
rsmpeg = { git = "https://github.com/aegroto/rsmpeg", rev = "a1f06d4c2c87e938bb6f84d66bb9c5afe4a006ed", default-features = false, features = ["ffmpeg8"] }
