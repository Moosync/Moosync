[package]
name = "moosync"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "core/types/src/lib.rs"

# This manifest exists solely for Bazel crate_universe dependency resolution.
# Do not build this crate directly with Cargo.

[dependencies]
async-trait = "0.1.92"
assertables = "10.1.0"
auto-launch = "0.6.0"
bitcode = "0.6.9"
blake3 = { version = "1.8.7", default-features = false }
chacha20poly1305 = "0.11.0"
criterion = "0.5.1"
crossbeam-channel = "0.5.17"
csscolorparser = "0.9.0"
dunce = "1.0.5"
env_logger = "0.11.11"
extism = "1.41.0"
extism-convert = "1.41.0"
fast_image_resize = "6.1.0"
fs_extra = "1.3.0"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
futures-util = { version = "0.3.34", default-features = false }
glob = "0.3.4"
hex = "0.4.3"
i-slint-backend-testing = "1.19.0"
i-slint-compiler = "1.19.0"
image = "0.25.10"
interprocess = { version = "2.4.7", features = ["tokio"] }
is_wine = "0.1.2"
jni = { version = "0.22.4", default-features = false, features = ["invocation"] }
keyring = { version = "4.2.0", default-features = false, features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store", "v1"] }
lazy_static = "1.5.1"
libpulse-binding = "2.30.1"
lofty = { version = "0.24.0", default-features = false }
lru = "0.19.0"
md-5 = "0.10.6"
mockall = "0.15.0"
notify = "8.2.1"
num_cpus = "1.17.0"
open = "5.4.5"
openssl-sys = "0.9.117"
platform-dirs = "0.3.0"
prctl = "1.0.0"
proc-macro2 = "1.0.107"
prost = "0.14.4"
prost-types = { version = "0.14.4", default-features = false }
protobuf = { version = "3.7.2", default-features = false, features = ["bytes"] }
protoc-gen-prost = "0.5.0"
pulldown-cmark = { version = "0.13.5", default-features = false }
quote = "1.0.47"
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.12.28", features = ["json", "stream"] }
rfd = { version = "0.17.2", features = ["xdg-portal"] }
rstest = { version = "0.28.0", default-features = false }
rusty_ffmpeg = { version = "0.16.7+ffmpeg.8", default-features = false, features = ["ffmpeg8"] }
semver = "1.0.28"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
slint = { version = "1.19.0", features = ["backend-android-activity-06", "mcp"] }
slint-build = "1.19.0"
slint-lsp = { version = "1.19.0", default-features = false }
souvlaki = "0.8.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
substring = "1.4.5"
syn = { version = "3.0.9", features = ["full"] }
tempdir = "0.3.7"
thiserror = "2.0.21"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "rt", "macros", "sync", "signal"] }
tracing = { version = "0.1.44", default-features = false }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter"] }
tracing-tracy = "0.12.0"
tracing-test = "0.2.6"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "js"] }
vergen = "10.0.3"
whoami = { version = "2.1.3", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
wiremock = "0.6.5"
sysuri = "0.4.0"
zip-extensions = "0.14.1"

# Git dependencies
rodio = { git = "https://github.com/RustAudio/rodio", rev = "685e05765c2aff8fbb51e32cda5b18428d09ffbe", default-features = false, features = ["playback"] }
rsmpeg = { git = "https://github.com/aegroto/rsmpeg", rev = "a1f06d4c2c87e938bb6f84d66bb9c5afe4a006ed", default-features = false, features = ["ffmpeg8"] }
