pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case "com.android.library":
                    useVersion("8.0.2")
                    break
                case "org.jetbrains.kotlin.android":
                    useVersion("1.8.20")
                    break
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()

    }
}

rootProject.name = 'tauri-plugin-audioplayer'

// Get Bazel output_base for finding tauri-android
def bazelOutputBase = {
    try {
        def process = ['bazel', 'info', 'output_base'].execute()
        process.waitFor()
        return process.text.trim()
    } catch (Exception e) {
        // bazel not available - fallback to OS-specific default
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def user = System.getProperty('user.name')
        def home = System.getProperty('user.home')
        return isWindows ? "${home}\\_bazel_${user}" : "${home}/.cache/bazel/_bazel_${user}"
    }
}()

def execroot = bazelOutputBase

if (execroot) {
    def tauriDir = new File(execroot, 'external').listFiles()?.find {
        it.name.matches('.*crates__tauri-\\d+\\..*') && !it.name.contains('plugin')
    }
    if (tauriDir) {
        include ':tauri-android'
        project(':tauri-android').projectDir = new File(tauriDir, 'mobile/android')
    }
}
