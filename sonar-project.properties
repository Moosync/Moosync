# Moosync SonarQube Project Configuration
sonar.projectKey=Moosync
sonar.projectName=Moosync
sonar.sources=.

# Ignore Bazel output symlinks, cache, generated files, and external dependencies
sonar.exclusions=bazel-*/**,.scannerwork/**,target/**,target-ui/**,node_modules/**,dist/**,package/**,coverage/**,coverage_report/**

# Exclude test files and generated files from code coverage calculations
sonar.coverage.exclusions=**/tests/**,**/*_test.rs,**/*_test_smoke.rs,**/*tests.rs,**/*test*.rs,**/build_script.out_dir/**,**/*.lib.rs,**/protos/*.lib.rs

# Clippy: disable SonarQube's built-in cargo invocation (which fails in Bazel-managed workspaces)
sonar.rust.clippy.enabled=false
# Ingest pre-generated Clippy diagnostics report
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Test Coverage: ingest LCOV reports generated by Bazel
sonar.rust.lcov.reportPaths=coverage.lcov,bazel-testlogs/**/coverage.dat
